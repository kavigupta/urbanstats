name: "docker_image"
description: "Based on a Dockerfile hash, checks if an image exists, if not, builds and pushes it"
inputs:
  dockerfile:
    description: "Path to the Dockerfile"
    required: true
  repository:
    description: "The docker respository"
    required: false
    default: ${{ github.repository }}/dockerfile-hash
  registry:
    description: "The docker registry"
    required: false
    default: ghcr.io
  token:
    description: "The Github token to access ghcr"
    required: true
outputs:
  image:
    description: "The fully qualified image generated"
    value: ${{ steps.image.outputs.image }}
runs:
  using: "composite"
  steps:
    - name: Create the tag by hashing the dockerfile
      id: tag
      run: echo "tag=$(shasum -a 256 ${{ inputs.dockerfile }} | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT
      shell: bash

    - name: concat the Docker image name
      id: image
      run: echo "image=${{ inputs.registry }}/${{ inputs.repository }}:${{ steps.tag.outputs.tag }}" >> $GITHUB_OUTPUT
      shell: bash

    - name: Check for existing image
      id: existing-image
      run: |
        GHCR_TOKEN=$(echo -n ${{ inputs.token }} | base64)
        # --http1.1 because ghcr.io intermittently kills the HTTP/2 stream, which curl
        # reports as exit 92. If curl fails anyway, the step fails here rather than
        # guessing about the registry's contents.
        response=$(curl -s -o /dev/null -w "%{http_code}" --http1.1 --retry 3 --retry-all-errors -H "Authorization: Bearer ${GHCR_TOKEN}" https://${{ inputs.registry }}/v2/${{ inputs.repository }}/manifests/${{ steps.tag.outputs.tag }})
        echo "Manifest query returned $response"
        # Only a 200 means the image is really there. Anything else has to build, because
        # skipping the build leaves every job that runs in this container to fail on an
        # unpullable image.
        echo "exists=$([ "$response" = 200 ] && echo true || echo false)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Log in to the Container registry
      if: ${{ steps.existing-image.outputs.exists == 'false' }}
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build and push Docker image
      if: ${{ steps.existing-image.outputs.exists == 'false' }}
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.image.outputs.image }}
