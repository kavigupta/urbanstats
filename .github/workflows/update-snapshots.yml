name: Update Reference Snapshots
on:
  issue_comment:
    types: [created]

env:
  GITHUB_TOKEN: ${{ secrets.FINE_GRAINED_TOKEN_FOR_UPDATE_SCREENSHOTS }}

jobs:
  update-snapshots:
    # !updateAssets and !updateScreenshots are the command's old names.
    if: github.event.issue.pull_request && (contains(github.event.comment.body, '!updateSnapshots') || contains(github.event.comment.body, '!updateAssets') || contains(github.event.comment.body, '!updateScreenshots'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('repo', pr.data.head.repo.full_name);

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.ref }}
          token: ${{ secrets.FINE_GRAINED_TOKEN_FOR_UPDATE_SCREENSHOTS }}

      - name: Get workflow run for PR head commit
        id: workflow-run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'check.yml',
              head_sha: '${{ steps.pr.outputs.sha }}',
              status: 'completed'
            });

            const usableRuns = runs.data.workflow_runs.filter(run => run.conclusion !== 'cancelled');

            if (usableRuns.length === 0) {
              core.setFailed('No completed workflow runs found for this PR head commit');
              return;
            }

            core.setOutput('run-id', usableRuns[0].id);

      - name: Download combined artifact
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: '${{ steps.workflow-run.outputs.run-id }}',
              per_page: 100
            });

            // Re-running one job bumps the run's attempt without re-running merge-snapshots, so
            // the newest combined artifact isn't necessarily the current attempt's.
            const artifact = artifacts
              .flatMap(candidate => {
                const attempt = /^combined-(\d+)$/.exec(candidate.name)?.[1];
                return attempt === undefined ? [] : [{ candidate, attempt: Number(attempt) }];
              })
              .sort((a, b) => b.attempt - a.attempt)[0]?.candidate;

            if (!artifact) {
              core.setFailed('No combined artifact found');
              return;
            }

            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip'
            });

            fs.writeFileSync('combined.zip', Buffer.from(download.data));

      - name: Extract and copy snapshots
        run: |
          # Extract the artifact
          unzip combined.zip -d combined_temp/
          mv combined_temp/changed_snapshots changed_snapshots_temp

          if [ ! -d "changed_snapshots_temp" ] || [ -z "$(find changed_snapshots_temp -type f ! -name '*.error.png' ! -name 'manifest.json' 2>/dev/null)" ]; then
            echo "No snapshot files found in artifact"
            exit 0
          fi

          # Create reference directory if it doesn't exist
          mkdir -p reference_test_snapshots

          # manifest.json is the snapshot diff viewer's index of the run, not a snapshot.
          find changed_snapshots_temp -type f ! -name "*.error.png" ! -name "manifest.json" -exec sh -c '         for file do
              rel_path="${file#changed_snapshots_temp/}"
              mkdir -p "reference_test_snapshots/$(dirname "$rel_path")"
              cp "$file" "reference_test_snapshots/$rel_path"
              echo "Copied: $rel_path"
            done
          ' _ {} +

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain reference_test_snapshots/)" ]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in reference snapshots"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has-changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add reference_test_snapshots/
          git commit -m "Update reference snapshots from !updateSnapshots command"
          git push
