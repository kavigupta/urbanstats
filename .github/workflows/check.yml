name: check
on:
  push:
    branches:
      - main
  pull_request:
env:
  # This is used in ci_proxy, do not remove. It is necessary so that
  # we can test against non-production data
  URBANSTATS_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FORCE_COLOR: 1
  SPARSE_CHECKOUT: |
    !named_region_shapefiles/*
    !outputs/*
    /*
jobs:
  supersede-older-runs:
    runs-on: ubuntu-22.04
    # This replaces `concurrency: cancel-in-progress`. A stacked push gives a PR above the
    # bottom one two identical pull_request events, and Github picked arbitrarily which of
    # the resulting runs to cancel. Cancelling the newer one leaves a check suite that
    # never reports tests-passed, which branch protection reads as a check still pending.
    # Ordering by run id instead means the newest run always survives.
    # Forks get a read-only token, so they can't cancel anything.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'keep-ci') }}
    permissions:
      actions: write
    steps:
      - name: Cancel this branch's older runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'check.yml',
              event: 'pull_request',
              branch: context.payload.pull_request.head.ref,
              per_page: 100
            });

            // A fork's runs live in this repo too, and its branch can share our name.
            const superseded = runs.filter(run =>
              run.id < context.runId
              && run.status !== 'completed'
              && run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}`
            );

            for (const run of superseded) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              } catch (error) {
                // The run finished between the listing and the cancel.
                if (error.status !== 409) {
                  throw error;
                }
              }
            }

  build-and-push-common-image:
    runs-on: ubuntu-22.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    permissions:
      packages: write
    env:
      # Checking out the working tree is ~30s of blob downloads, and every job that needs
      # the image waits on it. This job only hashes the Dockerfile and hands it to docker
      # build, so what it checks out is the build context, plus the actions it runs.
      # Anything a Dockerfile starts COPYing has to be added here.
      SPARSE_CHECKOUT: |
        /Dockerfile
        /.github/actions/*
    steps:
      - &checkout
        name: Checkout repository
        uses: nick-fields/retry@v3
        with:
          max_attempts: 5
          timeout_seconds: 30
          shell: bash
          command: |
            rm -rf $GITHUB_WORKSPACE/*

            git config --global --add safe.directory $GITHUB_WORKSPACE
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(echo -n x-access-token:$GITHUB_TOKEN | base64 -w0)"

            # Clone the repo
            git clone --no-checkout --filter=blob:none ${{ github.server_url }}/${{ github.repository }}.git $GITHUB_WORKSPACE

            # Enable sparse checkout
            git config core.sparseCheckout true

            # Configure sparse checkout
            echo "$SPARSE_CHECKOUT" > .git/info/sparse-checkout

            # Check out the ref
            git checkout --progress --force ${{ github.sha }}

      - uses: ./.github/actions/docker_image
        with:
          dockerfile: Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}
        id: image

  build-and-push-e2e-image:
    runs-on: ubuntu-22.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    permissions:
      packages: write
    env:
      # As above: this is the docker build context, not a working tree.
      SPARSE_CHECKOUT: |
        /react/test/Dockerfile
        /requirements*.txt
        /.github/actions/*
    steps:
      - *checkout

      - uses: ./.github/actions/docker_image
        with:
          dockerfile: react/test/Dockerfile
          extra-hash-files: requirements_screenshots.txt
          token: ${{ secrets.GITHUB_TOKEN }}
        id: image

  lint:
    runs-on: ubuntu-22.04
    needs: build-and-push-common-image
    container:
      image: ${{ needs.build-and-push-common-image.outputs.image }}
    env:
      SPARSE_CHECKOUT: |
        !outputs/*
        /*
    steps:
      - *checkout
      - uses: lukebrody/nothing-action@master # Without this, the below actions don't work. This is a bug in Github
      - uses: ./.github/actions/python_environment
      - uses: ./.github/actions/node_modules
      - name: Lint with pylint
        run: python -m pylint --prefer-stubs=true $(git ls-files '*.py' ':!:legacy')
        if: "!cancelled()" # Runs even if other steps fail
      - name: Lint with vulture
        run: python ./scripts/vulture.py
        if: "!cancelled()"
      - name: format
        run: ./scripts/format-python.sh
        if: "!cancelled()"
      - name: check if there are any changes
        # if there are, print the diff and exit with an error
        # this is needed because isort and black disagree on the formatting of some files, so we run both and check
        # if there's a difference
        run: bash -c '[ $(git status --porcelain --untracked-files=no | wc -c) -eq 0 ]  || (git status; git diff; exit 1)'
        if: "!cancelled()"
      - name: typecheck
        run: mypy --strict urbanstats-persistent-data/urbanstats_persistent_data
        if: "!cancelled()"
      - run: npm run lint:ci
        working-directory: react
        if: "!cancelled()"
      - run: npm run unused-exports
        working-directory: react
        if: "!cancelled()"

  build-frontend:
    runs-on: ubuntu-22.04
    needs: build-and-push-common-image
    container:
      image: ${{ needs.build-and-push-common-image.outputs.image }}
    steps:
      - *checkout
      - uses: ./.github/actions/python_environment
      - uses: ./.github/actions/node_modules
      - run: python3 create_website.py --mode ci --target scripts --site-folder react/test/density-db
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: react/test/density-db

  list-e2e-tests:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - *checkout
      - uses: ./.github/actions/node_modules
      - id: set-matrix
        run: echo "matrix=$(npx tsx test/scripts/list-e2e-tests.ts --test-durations='${{ vars.E2E_TEST_DURATIONS }}')" >> $GITHUB_OUTPUT
        working-directory: react

  e2e:
    runs-on: ubuntu-22.04
    needs:
      - build-and-push-e2e-image
      - build-frontend
      - list-e2e-tests
    container:
      image: ${{ needs.build-and-push-e2e-image.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        test-file: ${{ fromJson(needs.list-e2e-tests.outputs.matrix) }}
    timeout-minutes: 30
    steps:
      - *checkout
      - run: git fetch origin ${{ github.base_ref }} --depth=1 # needed so test runner can diff tests against base ref
        if: ${{ github.base_ref != '' }}
      # No python_environment here: the image carries what check_assets.py needs, and the
      # full venv is a 484MB restore that every shard would pay for.
      - uses: ./.github/actions/node_modules
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: react/test/density-db
      - name: Run tests
        run: |
          npm run test:e2e -- \
            --proxy=true \
            --browser=chromium \
            --test=test/${{ matrix.test-file }}.test.ts \
            --headless=true \
            --compare=true \
            --time-limit-seconds=500 \
            --base-ref=${{ github.base_ref }}
        working-directory: react
        env:
          URBAN_STATS_TEST_PASSWORD: ${{ secrets.URBAN_STATS_TEST_PASSWORD }}
          URBAN_STATS_TEST_TOTP: ${{ secrets.URBAN_STATS_TEST_TOTP }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
      - id: artifact-name
        if: "!cancelled()"
        shell: bash
        run: |
          name="${{ matrix.test-file }}"
          echo "name=${name:0:200}" >> $GITHUB_OUTPUT
      # A re-run keeps the artifacts the earlier attempt uploaded, so these names carry the
      # attempt. Re-running only the failed jobs loses nothing, because only a failing shard
      # writes changed assets, and a failing shard is exactly what gets re-run.
      - uses: actions/upload-artifact@v4
        if: "!cancelled()"
        with:
          name: delta-${{ github.run_attempt }}-${{ steps.artifact-name.outputs.name }}
          path: react/delta
      - uses: actions/upload-artifact@v4
        if: "!cancelled()"
        with:
          name: changed_assets-${{ github.run_attempt }}-${{ steps.artifact-name.outputs.name }}
          path: react/changed_assets
      # Both TestCafe's take-on-fail shots and the ones `flaky` takes per attempt land here, and
      # a run that passes deletes them, so this only ever carries pictures of something going wrong.
      - uses: actions/upload-artifact@v4
        if: "!cancelled()"
        with:
          name: error_screenshots-${{ github.run_attempt }}-${{ steps.artifact-name.outputs.name }}
          path: react/test_assets/**/*.error.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: "!cancelled()"
        with:
          name: test_histories-${{ steps.artifact-name.outputs.name }}
          path: react/test_histories
          overwrite: true

  merge-assets:
    runs-on: ubuntu-22.04
    needs: [e2e]
    if: "!cancelled()"
    steps:
      - *checkout
      - uses: ./.github/actions/node_modules
      - uses: actions/download-artifact@v4
        with:
          pattern: "delta-${{ github.run_attempt }}-*"
          path: combined/delta
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: "changed_assets-${{ github.run_attempt }}-*"
          path: combined/changed_assets
          merge-multiple: true
      - id: upload-combined
        uses: actions/upload-artifact@v4
        with:
          name: combined-${{ github.run_attempt }}
          path: combined
          if-no-files-found: ignore
      - uses: actions/download-artifact@v4
        with:
          pattern: "test_histories-*"
          path: react/test_histories
          merge-multiple: true
      - run: |
          npx tsx test/scripts/post-comment.ts
        working-directory: react
        env:
          ARTIFACT_ID: ${{ steps.upload-combined.outputs.artifact-id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  merge-and-save-durations:
    runs-on: ubuntu-22.04
    needs: [e2e]
    if: github.ref_name == github.event.repository.default_branch # We only want results where all tests run
    steps:
      - *checkout
      - uses: ./.github/actions/node_modules
      - uses: actions/download-artifact@v4
        with:
          pattern: "test_histories-*"
          path: react/test_histories
          merge-multiple: true
      - run: |
          npx tsx test/scripts/save-durations.ts
        working-directory: react
        env:
          FINE_GRAINED_TOKEN_FOR_VARIABLES: ${{ secrets.FINE_GRAINED_TOKEN_FOR_VARIABLES }}

  run-unit-tests:
    runs-on: ubuntu-22.04
    needs: [build-and-push-common-image]
    container:
      image: ${{ needs.build-and-push-common-image.outputs.image }}
    env:
      SPARSE_CHECKOUT: |
        !outputs/*
        /*
    steps:
      - *checkout
      - uses: lukebrody/nothing-action@master # Without this, the below actions don't work. This is a bug in Github
      - uses: ./.github/actions/python_environment
      - uses: ./.github/actions/node_modules
      - name: Run js tests
        run: |
          npm run test:unit -- \
            --proxy=true \
            --test='unit/*.test.ts'
        working-directory: react
        if: "!cancelled()" # Runs even if other steps fail
      - name: Test python
        run: python -m pytest tests
        if: "!cancelled()"
      - name: Test urbanstats persistent
        working-directory: urbanstats-persistent-data
        run: python -m pytest --cov=. --cov-report=xml --cov-report=term-missing tests
        if: "!cancelled()"

  # Sink job so that github can gate PR merge
  tests-passed:
    runs-on: ubuntu-22.04
    if: ${{ always() }}
    needs:
      - lint
      - run-unit-tests
      - e2e
    steps:
      - name: Tests Failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "${{ toJSON(needs) }}"
          echo "Tests failed!"
          exit 1
      - name: Tests Succeeded
        run: |
          echo "${{ toJSON(needs) }}"
          echo "Tests succeeded!"
