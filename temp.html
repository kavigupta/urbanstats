<body>
    <div id="map-container">
    </div>
    <script src="https://unpkg.com/maplibre-gl@5.2.0/dist/maplibre-gl.js"></script>
    <script>
        const london3d = {
            center: [-0.114, 51.506],
            zoom: 14.2,
            bearing: 55.2,
            pitch: 60,
        }

        const berlin = {
            center: [13.388, 52.517],
            zoom: 9.5,
            bearing: 0,
            pitch: 0,
        }

        const nyc = {
            center: [-74.006, 40.7128],
            zoom: 10,
            bearing: 0,
            pitch: 0,
        }

        async function initMap() {
            if (window.map) return

            // only the ranges Jost covers are served locally; the rest come from OpenFreeMap's Noto
            const jostRanges = new Set(await (await fetch('/fonts/ranges.json')).json())
            const transformRequest = (url, resourceType) => {
                const match = resourceType === 'Glyphs' && /\/fonts\/Jost(?: |%20)(\w+)\/(\d+)-(\d+)\.pbf$/.exec(url)
                if (match && !jostRanges.has(Number(match[2]))) {
                    const noto = { Regular: 'Regular', Medium: 'Regular', 550: 'Bold', Bold: 'Bold', Italic: 'Italic' }[match[1]]
                    return { url: `https://tiles.openfreemap.org/fonts/Noto%20Sans%20${noto}/${match[2]}-${match[3]}.pbf` }
                }
                return { url: new URL(url, location.href).href }
            }

            // MapLibre requires sprite URLs to be absolute, and checks before transformRequest
            const style = await (await fetch('/style.json')).json()
            style.sprite = style.sprite.map(sprite => ({ ...sprite, url: new URL(sprite.url, location.href).href }))

            const map = new maplibregl.Map({
                style,
                transformRequest,
                center: nyc.center,
                zoom: nyc.zoom,
                bearing: nyc.bearing,
                pitch: nyc.pitch,
                container: 'map-container',
                // boxZoom: false,
                // doubleClickZoom: false,
                scrollZoom: true,
                attributionControl: false,
                cooperativeGestures: false,
                dragRotate: false,
            })
            // map.on('styledata', function () {
            //     console.log(map.style.stylesheet)
            //     map.style.stylesheet.layers.forEach(function (layer) {
            //         console.log(layer)
            //         if (layer.type === 'symbol' && map.getLayer(layer.id)) {
            //             map.removeLayer(layer.id);
            //         }
            //     });
            // })

            window.map = map
        }
        initMap()

    </script>
</body>
