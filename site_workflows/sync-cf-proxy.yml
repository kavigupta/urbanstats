name: Sync CF Proxy

# Worker routes need proxied records, but GitHub only renews the Pages certificate while the apex resolves
# to GitHub. So this unproxies while GitHub reports no healthy certificate, and reproxies once it renews.
# Keep the zone on Full: Full (Strict) would answer 526 on a missed renewal and block the fix.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency: sync-cf-proxy

permissions:
  # If this endpoint 403s, some accounts require admin rather than pages:read — swap GH_TOKEN for a
  # PAT carrying it.
  pages: read

env:
  RECORD_NAME: urbanstats.org
  # Grey-cloud this far ahead of expiry even if GitHub still says `approved`, in case a renewal stalls
  # silently. The state check should fire first, around 30 days out.
  MIN_DAYS_LEFT: 14

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Read GitHub's certificate state
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pages=$(gh api "repos/$GITHUB_REPOSITORY/pages")
          state=$(jq -r '.https_certificate.state // "missing"' <<<"$pages")
          expires=$(jq -r '.https_certificate.expires_at // empty' <<<"$pages")

          days=0
          if [ -n "$expires" ]; then
            left=$(( $(date -d "$expires" +%s) - $(date +%s) ))
            days=$(( left / 86400 ))
            # Grey-clouding an expired certificate would serve it straight to browsers; staying
            # proxied keeps Cloudflare's edge certificate in front of it. Needs a human either way.
            if [ "$left" -le 0 ]; then
              echo "Certificate expired at $expires; leaving the proxy as it is." >&2
              exit 1
            fi
          fi

          if [ "$state" = approved ] && [ "$days" -gt "$MIN_DAYS_LEFT" ]; then
            want=true
          else
            want=false
          fi

          echo "state=$state expires=${expires:-none} days_left=$days -> proxied=$want"
          echo "want=$want" >> "$GITHUB_OUTPUT"

      - name: Apply it to the apex records
        env:
          # Needs Zone / DNS: Edit on urbanstats.org, on top of the Workers scopes the deploy
          # workflow uses this token for.
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          WANT: ${{ steps.decide.outputs.want }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H 'content-type: application/json' "$@"; }
          base="https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records"

          # AAAA records, if any, move with the A records so challenges over IPv6 reach GitHub. None is
          # normal, since Cloudflare serves proxied hostnames over IPv6 anyway.
          found=0
          for rtype in A AAAA; do
            records=$(api "$base?type=$rtype&name=$RECORD_NAME&per_page=100")
            [ "$(jq -r .success <<<"$records")" = true ] || { echo "$records"; exit 1; }
            found=$(( found + $(jq '.result | length' <<<"$records") ))

            for id in $(jq -r --argjson want "$WANT" '.result[] | select(.proxied != $want) | .id' <<<"$records"); do
              result=$(api -X PATCH "$base/$id" --data "{\"proxied\":$WANT}")
              [ "$(jq -r .success <<<"$result")" = true ] || { echo "$result"; exit 1; }
              echo "$rtype $id -> proxied=$WANT"
            done
          done

          # An empty pair means the apex is no longer the A records this steers — a flattened CNAME,
          # say — and the whole job would otherwise pass while doing nothing.
          [ "$found" -gt 0 ] || { echo "No A or AAAA records for $RECORD_NAME." >&2; exit 1; }
          echo "$found record(s) now at proxied=$WANT."
