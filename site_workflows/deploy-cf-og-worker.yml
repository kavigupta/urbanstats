name: Deploy CF OG Worker

# Redeploys the OG Worker on every Pages build, since it bundles the site's page-loading code. build.py
# writes the commit that built the site into the ref below, so a site from an unpushed commit fails here.
# Pushes made with GITHUB_TOKEN (retrostat) don't trigger this, but they don't change the ref either.
on:
  page_build:
  workflow_dispatch:

concurrency: deploy-cf-og-worker

jobs:
  deploy:
    runs-on: ubuntu-22.04
    if: github.event_name != 'page_build' || github.event.build.status == 'built'
    steps:
      - name: Checkout urbanstats
        uses: actions/checkout@v4
        with:
          repository: kavigupta/urbanstats
          ref: $URBANSTATS_REF
          token: ${{ secrets.URBANSTATS_TOKEN }}
          # Everything the Worker bundles lives under react/.
          sparse-checkout: react

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install dependencies
        working-directory: react
        run: npm ci

      - name: Deploy
        working-directory: react/cf-og-worker
        run: npx wrangler deploy
        env:
          # The token needs Account / Workers Scripts: Edit to upload the script, and
          # Zone / Workers Routes: Edit on urbanstats.org to attach the routes in wrangler.toml.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
