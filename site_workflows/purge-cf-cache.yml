name: Purge CF Cache

# Purges the zone on every Pages deploy, so cached assets and preview cards don't outlive their build.
# Doesn't wait for the Worker to redeploy; a card rendered in between is cleared by the next deploy.
on:
  page_build:
  workflow_dispatch:

concurrency: purge-cf-cache

jobs:
  purge:
    runs-on: ubuntu-22.04
    if: github.event_name != 'page_build' || github.event.build.status == 'built'
    steps:
      - name: Purge everything
        env:
          # Needs Zone / Cache Purge: Purge on urbanstats.org, on top of the scopes the other
          # workflows use this token for.
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          result=$(curl -sS -X POST \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache")
          [ "$(jq -r .success <<<"$result")" = true ] || { echo "$result"; exit 1; }
          echo "Purged."
