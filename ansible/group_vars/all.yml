---
app_dir: /opt/urbanstats-og-render

# The site the renderer screenshots, served by the `site` container beside it. That
# container serves the locally built bundle -- which is what carries the TestUtils
# `screencap` and `navigate` hooks urbanstats.org does not have yet -- and proxies
# everything else to production. Once the hooks ship, this becomes urbanstats.org and
# the `site` container goes away.
urbanstats_origin: http://site:8000

# Doubles as the concurrency limit, and that is what actually constrains it: a capture
# saturates 2-3.5 cores, so on a 4-core host two at once contend rather than overlap.
# Memory is not the limit here -- two warm pages sit around 1GB of the host's 3.8GB.
pool_size: 2

# Half scale is about 1200px wide, which is all a link embed displays.
capture_scale: 0.5

# Nothing here needs swap in normal operation. It exists because Chrome's footprint
# grows with every render, and swapping is a better failure than the OOM killer.
swap_file: /swapfile
swap_size: 2G

# Port ufw keeps open for SSH. Change this before running if sshd is not on 22,
# or the play will lock you out.
ssh_port: "{{ ansible_port | default(22) }}"
