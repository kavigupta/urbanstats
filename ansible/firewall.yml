---
- name: Configure the host firewall
  hosts: render
  become: true

  tasks:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    - name: Allow SSH before enabling ufw
      community.general.ufw:
        rule: limit
        port: "{{ ssh_port }}"
        proto: tcp

    - name: Deny incoming traffic by default
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Allow outgoing traffic by default
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable ufw
      community.general.ufw:
        state: enabled

# Only SSH is open. The renderer is published to 127.0.0.1 in compose, so it is
# reachable over an SSH tunnel and nowhere else. Note that Docker's published ports
# are NAT'd by iptables rules that run before ufw's, so binding to loopback -- not
# these rules -- is what keeps it private. When the Cloudflare worker needs to reach
# it, give it a tunnel rather than publishing the port and opening it here.
