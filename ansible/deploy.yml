---
- name: Install Docker and run the link-embed renderer
  hosts: render
  become: true

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - rsync
        state: present
        update_cache: true

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    # Uses curl rather than get_url: that module fails against newer target
    # Pythons on ansible-core 2.12 ("'CustomHTTPSConnection' object has no
    # attribute 'cert_file'").
    - name: Add Docker apt key
      ansible.builtin.command:
        cmd: curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        creates: /etc/apt/keyrings/docker.asc

    - name: Set permissions on the Docker apt key
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Read dpkg architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_architecture
      changed_when: false

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ dpkg_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine and the Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start Docker on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0750"

    # Unlike draw.fish, the image is built on the host rather than shipped to it.
    # There is no build step to run -- the service is plain node -- and the playwright
    # base image is around 2GB, which the host pulls from a registry far faster than
    # we could push it over SSH. So the sources go up instead of an image.
    - name: Copy the service
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../og-render/{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - Dockerfile
        - docker-compose.yml
        - package.json
        - package-lock.json
        - server.js
      register: service_files

    # Lives in its own directory because compose bind-mounts the directory: mounting
    # the file itself would pin the container to the inode this task replaces, leaving
    # Caddy on a stale config forever.
    - name: Copy the site server configuration
      ansible.builtin.file:
        path: "{{ app_dir }}/caddy"
        state: directory
        mode: "0755"

    - name: Copy the Caddy configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../og-render/Caddyfile"
        dest: "{{ app_dir }}/caddy/Caddyfile"
        mode: "0644"
      register: caddy_config

    - name: Create the site directory
      ansible.builtin.file:
        path: "{{ app_dir }}/site/scripts"
        state: directory
        mode: "0755"

    # Only the bundle is shipped. Everything else the page loads is proxied to
    # production by the site container, so this stays at tens of megabytes rather than
    # the ~3.2GB a full site build comes to. Source maps are excluded; nothing reads
    # them here, and they are half the size.
    - name: Sync the frontend bundle
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../dist-prod/"
        dest: "{{ app_dir }}/site/scripts/"
        delete: true
        rsync_opts:
          - "--exclude=*.map"
      register: bundle

    - name: Write the environment file
      ansible.builtin.copy:
        content: |
          URBANSTATS_ORIGIN={{ urbanstats_origin }}
          POOL_SIZE={{ pool_size }}
          CAPTURE_SCALE={{ capture_scale }}
          TUNNEL_TOKEN={{ tunnel_token }}
        dest: "{{ app_dir }}/.env"
        mode: "0640"
      no_log: true
      register: environment_file

    # Cheap when nothing changed, because the layer cache covers both the base image
    # and the npm install.
    - name: Build the image
      ansible.builtin.command:
        cmd: docker compose build
        chdir: "{{ app_dir }}"
      changed_when: true

    # Recreated on any change to the sources or the environment, since the warm pool
    # is built at startup and would otherwise keep serving the old configuration.
    - name: Start the service
      ansible.builtin.command:
        cmd: >-
          docker compose up -d --remove-orphans
          {{ '--force-recreate' if (service_files is changed or environment_file is changed
             or caddy_config is changed or bundle is changed) else '' }}
        chdir: "{{ app_dir }}"
      register: compose_up
      changed_when: >-
        'Started' in (compose_up.stderr | default('')) or
        'Created' in (compose_up.stderr | default('')) or
        'Recreated' in (compose_up.stderr | default(''))
