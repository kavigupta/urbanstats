name = "urbanstats-og"
main = "src/index.js"
compatibility_date = "2026-08-01"
# The site's data code decompresses with node's zlib, so the Worker needs it too.
compatibility_flags = ["nodejs_compat"]

# The prototype runs on its own subdomain rather than in front of urbanstats.org, so sharing a
# us.lbtunnel.uk link exercises the whole path without touching the real site. This route stays
# inert until an `us` record exists on the zone -- a Worker route only fires for a hostname that
# resolves.
routes = [
  { pattern = "us.lbtunnel.uk/*", zone_name = "lbtunnel.uk" },
]

# Fonts are bundled rather than fetched: satori needs the bytes on every render, and they never
# change. .wasm is picked up as a compiled module by default.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[vars]
SITE_ORIGIN = "https://urbanstats.org"

# `loadPageDescriptor` can load any page kind, so bundling it pulls every panel and everything they
# reach -- maps, plotly, katex -- for the sake of two pages we draw ourselves. These are the modules
# only reachable from page kinds the Worker never loads; stubbing them keeps the bundle at ~1.3 MiB
# gzip instead of ~2.2. Written exactly as PageDescriptor.ts imports them, since esbuild matches the
# specifier string.
[alias]
"../components/article-panel" = "./src/panel-stub.js"
"../map-partition" = "./src/panel-stub.js"
"../components/comparison-panel" = "./src/panel-stub.js"
"../stat/StatisticPanel" = "./src/panel-stub.js"
"../stat/utils" = "./src/panel-stub.js"
"../data-credit" = "./src/panel-stub.js"
"../uss-documentation" = "./src/panel-stub.js"
"../mapper/components/DebugMapTextBox" = "./src/panel-stub.js"
"../urban-stats-script/DebugEditorPanel" = "./src/panel-stub.js"
"../components/quiz-panel" = "./src/panel-stub.js"
"../quiz/quiz" = "./src/panel-stub.js"
"../quiz/statistics" = "./src/panel-stub.js"
"../quiz/infinite" = "./src/panel-stub.js"
"../quiz/friends" = "./src/panel-stub.js"
"../syau/syau-panel" = "./src/panel-stub.js"
"../mapper/components/MapperPanel" = "./src/panel-stub.js"
"../mapper/settings/utils" = "./src/panel-stub.js"
"../quiz/OauthCallbackPanel" = "./src/panel-stub.js"
"../quiz/AuthenticationStateMachine" = "./src/panel-stub.js"
"../dev/ScreenshotDiffViewerPanel" = "./src/panel-stub.js"
